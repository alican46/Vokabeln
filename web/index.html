<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Ferheng – Kurdisch lernen</title>
  <meta name="description" content="Vokabeltrainer für Kurdisch mit Ordnern, Verbformen und intelligenter Wiederholung.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ferheng">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="overlay"></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast"></div>
  <script src="version.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      // Wenn eine neue Version aktiv wird, einmal neu laden.
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloaded || !window.__hadController) return;
        reloaded = true; location.reload();
      });
      window.__hadController = !!navigator.serviceWorker.controller;
    }
  </script>
</body>
</html>
