name: iOS Build

on:
  push:
    paths-ignore:
      - 'web/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: App bauen (ohne Signatur)
        run: |
          xcodebuild \
            -project Ferheng.xcodeproj \
            -scheme Ferheng \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA-Datei erstellen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ferheng.app Payload/
          zip -qry Ferheng.ipa Payload

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Ferheng-ipa
          path: Ferheng.ipa
